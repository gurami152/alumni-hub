name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check code formatting (Laravel Pint)
      run: vendor/bin/pint --test

    - name: Static analysis (Larastan)
      run: vendor/bin/phpstan analyse --memory-limit=2G

    - name: Security check (Composer Audit)
      run: composer audit

    - name: Prepare environment for tests
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Architecture and Unit Tests (Pest)
      run: vendor/bin/pest
